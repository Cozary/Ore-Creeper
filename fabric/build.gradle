plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "0.8.1"
}
base {
    archivesName = "${mod_name}-fabric-${minecraft_version}-${version_fabric}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly project(":common")
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api}"
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = project(":common").file("CHANGELOG.md").text
    type = STABLE
    modLoaders.add("fabric")
    displayName = "${mod_name}-fabric-${minecraft_version}-${version_fabric}"
    dryRun = dry_run.toBoolean()
    version = version_fabric

        curseforge {
            accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
            projectId = curseforge_project_id
            minecraftVersions.add(minecraft_version)
            requires {
                slug = "forge-config-api-port-fabric"
            }
            optional {
                slug = "journeymap"
            }
        }


        modrinth {
            accessToken = accessToken = providers.environmentVariable("MODRINTH_API_KEY")
            projectId = modrinth_project_id
            minecraftVersions.add(minecraft_version)
            requires {
                slug = "forge-config-api-port"
            }
            optional {
                slug = "journeymap"
            }
        }

}
